name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: vet, staticcheck, race tests, build, the README's example scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest && staticcheck ./...
      - run: go test -race -count=1 -cover ./...
      - run: go build -o bin/credsweep ./cmd/credsweep
      - name: the README's example must actually exit 1 with the findings it claims
        run: |
          set +e
          rm -rf /tmp/credsweep-demo
          ./testdata/build-demo-repo.sh /tmp/credsweep-demo
          out=$(./bin/credsweep scan --allowlist testdata/demo-allowlist.yaml /tmp/credsweep-demo)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 1
          echo "$out" | grep -q "aws-access-key-id"
          echo "$out" | grep -q "the generic entropy rule can't tell the two apart"
          echo "$out" | grep -q "4 findings: 3 flagged, 1 allowed"
      - run: docker build -t credsweep:ci .
